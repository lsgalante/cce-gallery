[package]
name = "cce-gallery"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "77ff5e4843604c8f2f4e9b0ae04b73c05b4cb4db" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
serde_json = "1"


[lints.clippy]
# The toolkit's house style (cce-ui's [lints.clippy]): geometry, colour and paint state
# taken piecewise, and the legacy tuple views.
type_complexity = "allow"
