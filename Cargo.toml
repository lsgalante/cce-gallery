[package]
name = "cce-gallery"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "ffc09733c1a1f786ac89742e5754a7b8eb4a830f" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
serde_json = "1"


[lints.clippy]
# The toolkit's house style (cce-ui's [lints.clippy]): geometry, colour and paint state
# taken piecewise, and the legacy tuple views.
type_complexity = "allow"
